[package]
name = "webkit"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "Web content framework for TontooOS - Apple WebKit-style API backed by WebKitGTK"
readme = "README.md"
keywords = ["tontoo", "webkit", "web", "gtk4", "browser", "ui"]
categories = ["gui", "api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
corelocation = { path = "../CoreLocation" }

# Vello/WGPU path (default): texture-blit web view for TontooUI, no GTK.
tontooui = { path = "../TontooUI", optional = true }
vello = { version = "0.10", optional = true }

# Legacy GTK4 path: WebKitGTK widget embedding. Requires system
# webkit2gtk-4.1 and a GTK4 event loop; cannot be used inside
# TontooUI (Vello) windows.
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"], optional = true }
gio = { version = "0.20", optional = true }
glib = { version = "0.20", optional = true }
webkit6 = { version = "0.4", features = ["v2_44"], optional = true }
webkit6-sys = { version = "0.4", optional = true }
javascriptcore6 = { version = "0.4", optional = true }
soup = { package = "soup3", version = "0.7", optional = true }

[features]
default = ["vello"]
vello = ["dep:tontooui", "dep:vello"]
gtk-backend = ["dep:gtk", "dep:gio", "dep:glib", "dep:webkit6", "dep:webkit6-sys", "dep:javascriptcore6", "dep:soup"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tontoo-webengine"
path = "src/bin/tontoo-webengine.rs"

[[example]]
name = "browser"
path = "examples/browser.rs"
required-features = ["gtk-backend"]

[[example]]
name = "minimal"
path = "examples/minimal.rs"
required-features = ["gtk-backend"]

[[example]]
name = "vello_webview"
path = "examples/vello_webview.rs"
required-features = ["vello"]

[[example]]
name = "vello_browser"
path = "examples/vello_browser.rs"
required-features = ["vello"]