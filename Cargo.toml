[package]
name = "webkit"
version = "27.0.0"
edition = "2021"
license = "TCL"
description = "Web content framework for TontooOS - Apple WebKit-style API backed by Gecko"
readme = "README.md"
keywords = ["tontoo", "webkit", "web", "browser", "ui", "gecko", "firefox"]
categories = ["gui", "api-bindings"]

[build-dependencies]
cc = "1"

[dependencies]
foundation = { path = "../Foundation" }
corelocation = { path = "../CoreLocation" }

# Vello/WGPU path (default): texture-blit web view for TontooUI.
tontooui = { path = "../TontooUI", optional = true }
vello = { version = "0.10", optional = true }

# WPE WebKit path (default): offscreen rendering into a TontooUI window.
# Needs wpewebkit, libwpe, wpebackend-fdo and EGL at build and run time; the
# C shim in src/wpe does the WebKit and EGL calls.
#
# Gecko path (optional): headful Firefox over WebDriver BiDi. Firefox brings
# WebExtensions and its own window, so it is a second engine, not the
# default: it cannot be embedded into a TontooUI window.
tungstenite = { version = "0.26", optional = true }
ureq = { version = "3", optional = true }
lzma-rs = { version = "0.3", optional = true }
tar = { version = "0.4", optional = true }

[features]
default = ["vello", "wpe"]
vello = ["dep:tontooui", "dep:vello"]
wpe = []
gecko = ["dep:tungstenite", "dep:ureq", "dep:lzma-rs", "dep:tar"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tontoo-webengine"
path = "src/bin/tontoo-webengine.rs"

[[example]]
name = "vello_webview"
path = "examples/vello_webview.rs"
required-features = ["vello"]

[[example]]
name = "vello_browser"
path = "examples/vello_browser.rs"
required-features = ["vello"]

[[example]]
name = "tontoo_browser"
path = "examples/tontoo_browser.rs"
required-features = ["vello", "wpe"]

[[example]]
name = "gecko_browser"
path = "examples/gecko_browser.rs"
required-features = ["vello", "gecko"]