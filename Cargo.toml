[package]
name = "webkit"
version = "27.0.0"
edition = "2021"
license = "TCL"
description = "Web content framework for TontooOS - Apple WebKit-style API backed by WebKitGTK"
readme = "README.md"
keywords = ["tontoo", "webkit", "web", "browser", "ui"]
categories = ["gui", "api-bindings"]

[dependencies]
foundation = { path = "../Foundation" }
corelocation = { path = "../CoreLocation" }

# Vello/WGPU path (default): texture-blit web view for TontooUI.
tontooui = { path = "../TontooUI", optional = true }
vello = { version = "0.10", optional = true }

# Chromium path: headless Chromium driven over CDP (DevTools protocol).
# Pure Rust (websocket + PNG decode), needs a Chromium binary at RUNTIME
# only -- page JS runs inside the real Chromium sandbox. The helper can
# provision and auto-update a Chrome-for-Testing build itself (ureq+zip).
tungstenite = { version = "0.26", optional = true }
image = { version = "0.25", optional = true }
ureq = { version = "3", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[features]
default = ["vello", "chromium"]
vello = ["dep:tontooui", "dep:vello"]
chromium = ["dep:tungstenite", "dep:image", "dep:ureq", "dep:zip"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tontoo-webengine"
path = "src/bin/tontoo-webengine.rs"

[[example]]
name = "vello_webview"
path = "examples/vello_webview.rs"
required-features = ["vello"]

[[example]]
name = "vello_browser"
path = "examples/vello_browser.rs"
required-features = ["vello"]