[package]
name = "webkit"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "Web content framework for TontooOS - Apple WebKit-style API backed by WebKitGTK"
readme = "README.md"
keywords = ["tontoo", "webkit", "web", "gtk4", "browser", "ui"]
categories = ["gui", "api-bindings"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
gio = "0.20"
glib = "0.20"
webkit6 = { version = "0.4", features = ["v2_44"] }
webkit6-sys = "0.4"
javascriptcore6 = "0.4"
soup = { package = "soup3", version = "0.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
uikit = { path = "/Library/System/uikit" }
corelocation = { path = "../CoreLocation" }

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "browser"
path = "examples/browser.rs"

[[example]]
name = "minimal"
path = "examples/minimal.rs"